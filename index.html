<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141210" />
    <script>
      // Apply the device theme before first paint (no dark flash for Light / Pink Aura).
      // Pink Aura is its own skin, so it doesn't carry the classic `light` class.
      // Mirrors applyTheme() in src/store/useStore.ts.
      (function () {
        try {
          var t = localStorage.getItem('ff_theme');
          if (t !== 'light' && t !== 'pink') t = 'dark';
          var c = document.documentElement.classList;
          c.toggle('dark', t === 'dark');
          c.toggle('light', t === 'light');
          c.toggle('pink', t === 'pink');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', { dark: '#141210', light: '#f6f8fc', pink: '#ffffff' }[t]);
        } catch (e) { /* storage blocked: keep the dark default */ }
      })();
    </script>
    <title>FinFlow — Personal Finance</title>

    <!-- PWA: installable, offline-capable -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinFlow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400..800&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
